# Example only: enable after auth+parity approval for this exact API route.
# Maps PHP catalog.php?action=brands (BrandRefinement by article).
location = /api/v1/catalog/article-brands {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-EcomAE-Route-Cutover api-shadow-approved;
}
