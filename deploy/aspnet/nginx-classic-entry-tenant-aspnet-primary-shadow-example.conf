location ^~ /BOS/ {
    # Super-CP only — never proxy product BOS trees on tenants.
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(www\.)?(epartscart|electronicae|stylenlook|thejewellerytrend|taxofinca)\.com$) { return 418; }
    return 404;
}
# Lang trees /en /me /ru above own all former PHP commerce HTML. Bare /shop/ without lang
# still remaps via PhpProductPathRedirectMiddleware when it hits Kestrel (uppercase shells).
# Uppercase /CP/ /ERP/ remaps above stay — those are admin shells.
# PHP HTML compare: /php-reference/* only (operator restore when asked).

# SEO: robots.txt advertises Sitemap: /sitemap.xml — file artifact is often missing.
# Serve PHP sitemap-index.php (pages + warehouse shards). Prefer PHP over Kestrel.
location = /sitemap.xml {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(www\.)?(epartscart|electronicae|stylenlook|thejewellerytrend|taxofinca)\.com$) { return 418; }
    rewrite ^ /sitemap-index.php last;
}

# PHP reference SEPARATE (product tenants; internal rewrite — never bounce to product /cp|/erp)
# Browser URL stays /php-reference/*; index.php boots the PHP shell via epc_php_reference_router.php.
location = /php-reference/home {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(www\.)?(epartscart|electronicae|stylenlook|thejewellerytrend|taxofinca)\.com$) { return 418; }
    rewrite ^ /index.php?epc_php_reference=home last;
}
