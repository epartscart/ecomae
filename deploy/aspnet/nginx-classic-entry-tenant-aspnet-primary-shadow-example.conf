# Exact-route tenant-shared entries → ASP.NET (URL PRESERVED) for epartscart.com.
# Install into the server{} whose server_name is www.epartscart.com.
# On this CloudPanel that block often lives INSIDE www.ecomae.com.conf (mega-conf);
# the installer is server-block scoped (never file-first-block only).
#
# Do NOT install on wildcard-ecomae when that file is server_name *.ecomae.com only
# — nginx never selects that vhost for Host: www.epartscart.com.
#
# Host-gated: safe if the same locations ever appear on a shared server_name list;
# non-epartscart hosts keep PHP (return 418 → @epc_classic_php_passthrough).
#
# Requires ECOMAE_CONFIRM_LIVE_TENANT_ASPNET_PARITY_SHADOW=YES.

# Named fallback: re-enter PHP via front controller (non-epartscart hosts on wildcard).
location @epc_classic_php_passthrough {
    rewrite ^ /index.php?epc_classic_php_passthrough=1 last;
}

location = / {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(www\.)?epartscart\.com$) { return 418; }
    proxy_pass http://127.0.0.1:5100/storefront/app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover classic-entry-tenant-home-storefront;
}

