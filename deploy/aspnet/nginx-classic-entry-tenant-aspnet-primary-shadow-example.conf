# Exact-route tenant-shared entries → ASP.NET (URL PRESERVED) for epartscart.com.
# / → storefront app; /cp /erp /bos → ASP.NET apps; PHP reference under /php-reference/*.
# Requires ECOMAE_CONFIRM_LIVE_TENANT_ASPNET_PARITY_SHADOW=YES.
#
# Install via:
#   ECOMAE_CONFIRM_INSTALL_CLASSIC_ENTRY_ASPNET_PRIMARY=YES \
#   ECOMAE_CONFIRM_LIVE_TENANT_ASPNET_PARITY_SHADOW=YES \
#   ECOMAE_CLASSIC_ENTRY_HOST=tenant \
#     bash scripts/cloudpanel_install_classic_entry_aspnet_primary.sh

location = / {
    proxy_pass http://127.0.0.1:5100/storefront/app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover classic-entry-tenant-home-storefront;
}

