# Product tenant-shared entries → ASP.NET for ALL named live tenants.
# BOS is Super-CP only: /bos|/BOS|/bos/login|/php-reference/bos → 404 on tenants.
# Hosts: epartscart, electronicae, stylenlook, thejewellerytrend, taxofinca (+www).
# Install into each tenant server{} (mega-conf safe; server-block scoped).
#
# Do NOT install on wildcard-ecomae when that file is server_name *.ecomae.com only
# — nginx never selects that vhost for Host: www.epartscart.com (or other product tenants).
#
# Host-gated: non-product hosts on a shared location list keep PHP
# (return 418 → @epc_classic_php_passthrough).
# PHP product compare stays only under /php-reference/* → index.php.
#
# Requires ECOMAE_CONFIRM_LIVE_TENANT_ASPNET_PARITY_SHADOW=YES.

# Named fallback: non-product hosts re-enter PHP via front controller.
location @epc_classic_php_passthrough {
    rewrite ^ /index.php?epc_classic_php_passthrough=1 last;
}

location = / {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(www\.)?(epartscart|electronicae|stylenlook|thejewellerytrend|taxofinca)\.com$) { return 418; }
    proxy_pass http://127.0.0.1:5100/storefront/app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover classic-entry-tenant-home-storefront;
}

