# ALL /storefront/* → Kestrel (including search-app / cart-app / garage-app / login).
# Do NOT edge-redirect stubs to /en/* here:
#   - ASP.NET StorefrontStubToPhpRedirectMiddleware already maps stubs → PHP when needed
#   - When TemporarilyDeactivatePhpServing / PreferAspNetApps, /en/* is 503 and
#     error_page → epc-platform-splash.html traps shoppers in a warm-up loop
# Home + logout + apps stay on Kestrel.
location ^~ /storefront/ {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(www\.)?(epartscart|electronicae|stylenlook|thejewellerytrend|taxofinca)\.com$) { return 418; }
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover classic-entry-storefront-tree;
}
# ALL language commerce trees → Kestrel. Product browser must NEVER render PHP nero.
# PHP page bodies only via /php-reference/* (archive; paused unless operator restores).
# Backend ajax/write bridges may still call PHP APIs — that is not a product HTML page.
location ^~ /en/ {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(www\.)?(epartscart|electronicae|stylenlook|thejewellerytrend|taxofinca)\.com$) { return 418; }
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover classic-entry-en-lang-tree;
}
