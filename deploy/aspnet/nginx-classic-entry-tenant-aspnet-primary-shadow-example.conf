# Exact-route tenant-shared entries for epartscart.com.
# Install into the server{} whose server_name is www.epartscart.com (often inside
# www.ecomae.com.conf mega-conf — installer is server-block scoped).
#
# HOME `/` = PHP same-to-same (full modex header/footer/search/AI/dock).
# `/cp` `/erp` `/bos` (+ login bridges) = ASP.NET same-URL.
# `/storefront/app` Blazor scaffold is NOT the live home (preview/compare only).
#
# Do NOT install on wildcard-ecomae when that file is server_name *.ecomae.com only.
# Requires ECOMAE_CONFIRM_LIVE_TENANT_ASPNET_PARITY_SHADOW=YES.

# Named fallback: re-enter PHP via front controller (non-epartscart hosts on wildcard).
location @epc_classic_php_passthrough {
    rewrite ^ /index.php?epc_classic_php_passthrough=1 last;
}

# HOME: PHP same-to-same presentation (full modex header/footer/search/AI/dock).
# Do NOT serve simplified Blazor /storefront/app chrome here — dual-sample not green.
# /cp /erp /bos stay ASP.NET below; /storefront/app remains compare/preview only.
location = / {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(www\.)?epartscart\.com$) { return 418; }
    rewrite ^ /index.php last;
}

location = /CP {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(www\.)?epartscart\.com$) { return 418; }
    proxy_pass http://127.0.0.1:5100/cp/app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover classic-entry-cp;
}
location = /CP/ {
    error_page 418 = @epc_classic_php_passthrough;
