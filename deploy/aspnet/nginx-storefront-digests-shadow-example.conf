# Example only: enable AFTER authenticated storefront digest smoke + parity approval.
# Prefer batch install of all exact location = blocks (one nginx reload):
#   ECOMAE_CONFIRM_INSTALL_STOREFRONT_DIGEST_SHADOWS=YES \
#     bash scripts/cloudpanel_install_storefront_digest_shadows.sh
# Or copy individual location blocks one at a time. Never proxy broad /storefront or /.
# Rollback: restore the .bak.storefront-digests.* backup and reload nginx so PHP remains authoritative.

location = /storefront/account-summary {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover storefront-account-summary-shadow-approved;
}

