# Example only: enable AFTER authenticated storefront digest smoke + parity approval.
# Copy individual location blocks one at a time. Never proxy broad /storefront or /.
# Rollback: remove the enabled conf snippet and reload nginx so PHP remains authoritative.

location = /storefront/account-summary {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover storefront-account-summary-shadow-approved;
}

