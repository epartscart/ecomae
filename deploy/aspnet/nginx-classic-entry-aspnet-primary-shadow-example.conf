# --- PHP reference (SEPARATE links; may 302 to a known PHP URL) ---
# Shared /cp /erp /bos / stay on ASP.NET; these are compare-only.
location = /php-reference/home {
    return 302 /index.php;
}
location = /php-reference/cp {
    return 302 /cp/shop/orders/orders;
}
location = /php-reference/erp {
    return 302 /index.php?epc_php_reference=erp;
}
location = /php-reference/bos {
    return 302 /index.php?epc_php_reference=bos;
}
location = /php-reference/storefront {
    return 302 /index.php?epc_php_reference=storefront;
}
