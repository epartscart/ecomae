# Exact-route classic tenant-shared entries → ASP.NET (URL PRESERVED).
# Browser stays on /cp /erp /bos / (no redirect to /cp/app).
# PHP reference is SEPARATE under /php-reference/*.
# NEVER broad location /cp|/erp|/bos|/storefront — only location = .
#
# www.ecomae.com home → marketing app
# Install:
#   ECOMAE_CONFIRM_INSTALL_CLASSIC_ENTRY_ASPNET_PRIMARY=YES \
#     bash scripts/cloudpanel_install_classic_entry_aspnet_primary.sh
#
# epartscart.com uses tenant example (storefront home) via multi-host operator.

# --- Home (www marketing) — URL stays / ---
location = / {
    proxy_pass http://127.0.0.1:5100/marketing/app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover classic-entry-home-marketing;
}

