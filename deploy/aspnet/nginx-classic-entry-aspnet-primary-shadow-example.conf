# Exact-route classic PHP entry → ASP.NET primary (human-confirmed).
# PHP project stays installed as reference (/index.php + deep /cp|/erp|/bos module paths).
# NEVER broad location /cp|/erp|/bos|/storefront|/ — only location = exact redirects.
#
# Install:
#   ECOMAE_CONFIRM_INSTALL_CLASSIC_ENTRY_ASPNET_PRIMARY=YES \
#     bash scripts/cloudpanel_install_classic_entry_aspnet_primary.sh
#
# Rollback: restore .bak.classic-entry-aspnet.* and reload nginx.

# --- Home / marketing entry (exact root only; deep paths unchanged) ---
location = / {
    return 302 /marketing/app;
}

# --- Control Panel entry (PHP deep modules e.g. /cp/shop/... remain) ---
location = /CP {
    return 302 /cp/app;
}
location = /CP/ {
    return 302 /cp/app;
}
location = /cp {
    return 302 /cp/app;
}
location = /cp/ {
    return 302 /cp/app;
}

# --- ERP entry ---
location = /ERP {
    return 302 /erp/app;
}
location = /ERP/ {
    return 302 /erp/app;
}
location = /erp {
    return 302 /erp/app;
}
location = /erp/ {
    return 302 /erp/app;
}

# --- BOS entry (bare /bos is product chrome, NOT /marketing/bos) ---
location = /BOS {
    return 302 /bos/app;
}
location = /BOS/ {
    return 302 /bos/app;
}
location = /bos {
    return 302 /bos/app;
}
location = /bos/ {
    return 302 /bos/app;
}

