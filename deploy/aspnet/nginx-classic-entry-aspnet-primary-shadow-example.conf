# --- PHP reference (SEPARATE; only entry into PHP for compare/archive) ---
# Internal rewrite keeps /php-reference/* in the browser; index.php boots PHP shells.
# Never bounce into product /cp|/erp|/bos (those are ASP.NET-primary).
location = /php-reference/home {
    rewrite ^ /index.php?epc_php_reference=home last;
}
location = /php-reference/cp {
    rewrite ^ /index.php?epc_php_reference=cp last;
}
location = /php-reference/erp {
    rewrite ^ /index.php?epc_php_reference=erp last;
}
location = /php-reference/bos {
    rewrite ^ /index.php?epc_php_reference=bos last;
}
