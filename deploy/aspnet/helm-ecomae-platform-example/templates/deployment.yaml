{{- /*
DESIGN ONLY scaffold Deployment. Not applied by CloudPanel scripts.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    ecomae.cutoverAllowed: "{{ .Values.cutoverAllowed }}"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      containers:
        - name: platform
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:{{ .Values.service.port }}"
            - name: MigrationRouteCutover__RequirePhpFallback
              value: "{{ .Values.phpFallbackRequired }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
