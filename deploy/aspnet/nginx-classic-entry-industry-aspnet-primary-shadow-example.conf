# Industry showcase hosts (*.ecomae.com) → ASP.NET for / /cp /erp.
# BOS is Super-CP only: /bos|/BOS|/bos/login|/php-reference/bos → 404 on industry.
# Full catalog: EcomaeIndustryShowcaseHosts (28 slugs).
# Install into each industry server{} OR wildcard-ecomae (*.ecomae.com) block.
# Host-gated: non-industry hosts on a shared location list keep PHP
# (return 418 → @epc_classic_php_passthrough).
# PHP product compare stays only under /php-reference/* → index.php.
#
# Requires ECOMAE_CONFIRM_LIVE_TENANT_ASPNET_PARITY_SHADOW=YES (all-sites unlock).

location @epc_classic_php_passthrough {
    rewrite ^ /index.php?epc_classic_php_passthrough=1 last;
}

location = / {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(agriculture|automotive|beauty|cleaning|construction|education|electronics|energy|fashion|finance|food|healthcare|homeliving|hospitality|jewellery|logistics|manufacturing|media|nonprofit|pet|printing|professional|rental|retail|security|sports|technology|wholesale)\.ecomae\.com$) { return 418; }
    # Industry hub — ASP.NET EcomaeIndustryShowcaseMiddleware serves PHP-parity snapshot
    # (also handles legacy /storefront/app remap). Not the auto-parts storefront.
    proxy_pass http://127.0.0.1:5100/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover classic-entry-industry-home-showcase;
}

# Sub-industry paths (e.g. /vehicle-dealership-sales) — must hit Kestrel snapshots,
# not PHP product redirect → / (which previously looped to wrong storefront).
location ~ ^/[a-z0-9][a-z0-9-]{2,}/?$ {
    error_page 418 = @epc_classic_php_passthrough;
    if ($host !~* ^(agriculture|automotive|beauty|cleaning|construction|education|electronics|energy|fashion|finance|food|healthcare|homeliving|hospitality|jewellery|logistics|manufacturing|media|nonprofit|pet|printing|professional|rental|retail|security|sports|technology|wholesale)\.ecomae\.com$) { return 418; }
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover classic-entry-industry-sub;
}

