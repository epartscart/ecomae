# lifeos.ecomae.com — LifeOS™ product host (ASP.NET primary).
# Do NOT reuse www classic-entry `location = /` → /marketing/app.
#
# Install into the lifeos.ecomae.com server block (or create one), then:
#   nginx -t && systemctl reload nginx
# After merge, also FORCE_LIVE so Kestrel has LifeOsHostHomeMiddleware divert.
#
# Bare / must reach Kestrel as `/` (or `/lifeos`) with Host: lifeos.ecomae.com
# so LifeOsHostHomeMiddleware can rewrite to /lifeos.

# --- LifeOS home — URL stays / ---
location = / {
    proxy_pass http://127.0.0.1:5100/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover lifeos-host-home;
}

location = /lifeos {
    proxy_pass http://127.0.0.1:5100/lifeos;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover lifeos-host-product;
}

location = /lifeos/ {
    proxy_pass http://127.0.0.1:5100/lifeos;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover lifeos-host-product;
}

# LifeOS consoles + digests
location ^~ /lifeos/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover lifeos-host-tree;
}

# Platform assets / Blazor framework
location ^~ /_framework/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /platform-assets/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Super-CP surfaces must not answer on the LifeOS customer host
location ~* ^/(ip|bos|IP|BOS)(/|$) {
    return 404;
    add_header X-EcomAE-LifeOs-Host-Gate "super-cp-only" always;
}
