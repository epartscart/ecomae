# Include inside the existing CloudPanel/Nginx server block after replacing YOUR_OFFICE_IP.
# This exposes only ASP.NET diagnostics while all business traffic remains on PHP.

location = /health {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /migration/ {
    allow YOUR_OFFICE_IP;
    deny all;

    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
