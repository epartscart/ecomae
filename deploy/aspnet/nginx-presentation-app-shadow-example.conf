# Exact-route Blazor presentation-parity previews + login bridge (NOT product chrome cutover).
# These mirror PHP CP/ERP/BOS/storefront presentation using PHP CSS + digest KPIs.
# Never proxy broad /cp /erp /bos /storefront /.
#
# Install:
#   ECOMAE_CONFIRM_INSTALL_PRESENTATION_APP_SHADOWS=YES \
#     bash scripts/cloudpanel_install_presentation_app_shadows.sh
#
# Rollback: restore .bak.presentation-apps.* backup and reload nginx.

location = /cp/app {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover cp-app-presentation-preview;
}

