# Example only: enable AFTER staging smoke + parity approval for each exact path.
# Copy individual location blocks one at a time. Never proxy broad /cp, /erp, or /bos.
# Rollback: remove the enabled conf snippet and reload nginx so PHP remains authoritative.

# Read-only migration diagnostics (already public on loopback in many deploys):
# location = /migration/php-decommission-readiness { proxy_pass http://127.0.0.1:5100; ... }
# location = /migration/live-surface-links { proxy_pass http://127.0.0.1:5100; ... }

location = /cp/dashboard-summary {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover cp-digest-shadow-approved;
}

