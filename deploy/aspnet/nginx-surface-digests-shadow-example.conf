# Example only: enable AFTER staging smoke + parity approval.
# Prefer batch install of all exact location = blocks (one nginx reload):
#   ECOMAE_CONFIRM_INSTALL_SURFACE_DIGEST_SHADOWS=YES \
#     bash scripts/cloudpanel_install_surface_digest_shadows.sh
# Or copy individual location blocks one at a time. Never proxy broad /cp, /erp, or /bos.
# Rollback: restore the .bak.surface-digests.* backup and reload nginx so PHP remains authoritative.
# Storefront digests: see nginx-storefront-digests-shadow-example.conf

