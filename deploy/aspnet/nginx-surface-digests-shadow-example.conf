# Example only: enable AFTER staging smoke + parity approval.
# Prefer batch install of all exact location = blocks (one nginx reload):
#   ECOMAE_CONFIRM_INSTALL_SURFACE_DIGEST_SHADOWS=YES \
#     bash scripts/cloudpanel_install_surface_digest_shadows.sh
# Or copy individual location blocks one at a time. Never proxy broad /cp, /erp, or /bos.
# Rollback: restore the .bak.surface-digests.* backup and reload nginx so PHP remains authoritative.
# Storefront digests: see nginx-storefront-digests-shadow-example.conf

# Read-only migration diagnostics (already public on loopback in many deploys):
# location = /migration/php-decommission-readiness { proxy_pass http://127.0.0.1:5100; ... }
# location = /migration/live-surface-links { proxy_pass http://127.0.0.1:5100; ... }

location = /cp/dashboard-summary {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-EcomAE-Route-Cutover cp-digest-shadow-approved;
}

