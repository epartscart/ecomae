<link rel="stylesheet" href="/content/general_pages/epc_car_mod_theme.css?v=20261019pc1">
<style>
.epc-pc-cat-page .epc-pf-panel {
	background: #fff;
	border: 1px solid #e2e8f0;
	border-radius: 12px;
	margin-top: 12px;
	padding: 14px 16px;
}
.epc-pc-cat-page .epc-pf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.epc-pc-cat-page .epc-pf-table th,
.epc-pc-cat-page .epc-pf-table td { border: 1px solid #e1e7ef; padding: 8px; vertical-align: top; }
.epc-pc-cat-page .epc-pf-table th { background: #f5f7fa; color: #64748b; }
.epc-pc-cat-page .epc-pf-brand-row { cursor: pointer; }
.epc-pc-cat-page .epc-pf-brand-row:hover { background: #fff7ed; }
.epc-pc-cat-page .epc-pf-loader,
.epc-pc-cat-page .epc-pf-msg { padding: 28px; text-align: center; color: #64748b; }
.epc-pc-cat-page .epc-pf-msg { background: #fff8e1; border: 1px solid #f0d98a; border-radius: 10px; }
.epc-pc-cat-page .epc-pf-section-title { margin: 0 0 10px; font-size: 16px; font-weight: 800; color: #0f172a; }
.epc-pc-cat-page .epc-pf-cat-backbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.epc-pc-cat-page .epc-pf-cat-meta { margin-left: auto; color: #64748b; font-size: 12px; }
/* car-mod style: illustration on top, name strip below */
.epc-pc-cat-page .epc-vc-cat-card { padding: 0; overflow: hidden; }
.epc-pc-cat-page .epc-vc-cat-card .epc-vc-cat-icon {
	background: #fff; border-radius: 0; height: 110px; width: 100%; margin: 0;
}
.epc-pc-cat-page .epc-vc-cat-card .epc-vc-cat-icon img {
	height: 92px; max-width: 130px; width: auto;
}
.epc-pc-cat-page .epc-vc-cat-card .epc-vc-cat-icon .fa { font-size: 40px; }
.epc-pc-cat-page .epc-vc-cat-card .epc-pc-cat-name {
	border-top: 1px solid #eef2f7; padding: 10px 8px 12px;
}
.epc-pc-cat-page .epc-vc-cat-card .epc-pc-cat-name strong { font-size: 12px; }
</style>

<div class="epc-pc-cat-page epc-cm" id="epc-product-categories" data-lang="/en"
	data-icon-base="/content/files/epc-cata/category-icons/">
	<div id="epc-pc-main">
		<div class="epc-pf-loader" id="epc-pc-loading"><i class="fa fa-spinner fa-spin"></i> Loading product categories…</div>
	</div>
</div>

<script>
(function () {
	var root = document.getElementById('epc-product-categories');
	if (!root) { return; }
	var mainEl = document.getElementById('epc-pc-main');
	var langHref = root.getAttribute('data-lang') || '/en';

	var ICON_MAP = [
		{ re: /filter/i, id: 2, fa: 'fa-filter' },
		{ re: /brake/i, id: 5, fa: 'fa-stop-circle' },
		{ re: /spark|glow|ignition|electri|lighting|lamp|hybrid/i, id: 10, fa: 'fa-bolt' },
		{ re: /belt/i, id: 8, fa: 'fa-circle-o' },
		{ re: /fuel|mixture/i, id: 17, fa: 'fa-tint' },
		{ re: /radiat|cool/i, id: 19, fa: 'fa-thermometer-half' },
		{ re: /joint|bearing|axle|wheel|driv/i, id: 4, fa: 'fa-compress' },
		{ re: /engine|piston|gasket/i, id: 3, fa: 'fa-cogs' },
		{ re: /suspension|spring|damp|shock/i, id: 15, fa: 'fa-arrows-v' },
		{ re: /steer/i, id: 14, fa: 'fa-dot-circle-o' },
		{ re: /clutch|transmission|gear/i, id: 16, fa: 'fa-cog' },
		{ re: /exhaust|emission/i, id: 9, fa: 'fa-cloud' },
		{ re: /heat|ventil|air.?cond/i, id: 12, fa: 'fa-fan' },
		{ re: /body|clean|wip|glass|interior|mirror|window/i, id: 11, fa: 'fa-car' },
		{ re: /chemic|oil|lubric|fluid|service|maintenance/i, id: 13, fa: 'fa-flask' },
		{ re: /tyre|tire/i, id: 18, fa: 'fa-life-ring' },
		{ re: /access|tool|other|universal/i, id: 1, fa: 'fa-wrench' }
	];
	var iconBase = (root.getAttribute('data-icon-base') || '/content/files/epc-cata/category-icons/').replace(/\/?$/, '/');
	function iconHtml(label) {
		var name = String(label || '');
		var meta = { id: 0, fa: 'fa-wrench' };
		for (var i = 0; i < ICON_MAP.length; i++) {
			if (ICON_MAP[i].re.test(name)) { meta = ICON_MAP[i]; break; }
		}
		if (meta.id > 0) {
			return '<img src="' + esc(iconBase + meta.id + '.png') + '" alt="" loading="lazy" decoding="async"'
				+ ' onerror="this.parentNode.innerHTML=\'<i class=\\\'fa ' + meta.fa + '\\\'></i>\'">';
		}
		return '<i class="fa ' + meta.fa + '"></i>';
	}

	var state = {
		tree: [],          // root nodes [{CATEGORY_ID,DES,CHILD}]
		path: [],          // stack of drilled nodes from root to current parent
		leaf: null,        // leaf node whose articles are showing
		parts: null,       // leaf parts payload
		famLabels: null,   // warehouse product-family labels (loaded once, for stock merge)
		loading: false
	};
	var FAMILY_API = '/content/shop/docpart/ajax_epc_product_family.php';

	function esc(s) {
		return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
	}
	function normArticle(a) {
		return String(a || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
	}
	function partUrl(brand, article) {
		var n = normArticle(article);
		var b = String(brand || '').trim();
		if (!b || !n) { return '#'; }
		return langHref + '/parts/' + encodeURIComponent(b) + '/' + encodeURIComponent(n);
	}
	function api(action, params) {
		var q = 'action=' + encodeURIComponent(action);
		Object.keys(params || {}).forEach(function (k) {
			q += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
		});
		return fetch('/api/emsh_proxy.php?' + q, { credentials: 'same-origin' })
			.then(function (r) {
				var type = (r.headers.get('content-type') || '').toLowerCase();
				if (!r.ok || type.indexOf('json') === -1) {
					throw new Error('Catalog returned HTTP ' + r.status);
				}
				return r.json();
			});
	}
	function countLeaves(node) {
		if (!node.CHILD || !node.CHILD.length) { return 1; }
		var n = 0;
		node.CHILD.forEach(function (c) { n += countLeaves(c); });
		return n;
	}


	function cardHtml(node) {
		var kids = (node.CHILD || []).length;
		var meta = kids ? (kids + ' subcategories') : (countLeaves(node) + ' leaf');
		var search = [node.DES].join(' ');
		(node.CHILD || []).forEach(function (c) { search += ' ' + c.DES; });
		return '<button type="button" class="epc-vc-cat-card" data-cat="' + esc(node.CATEGORY_ID) + '" data-search="' + esc(search) + '">'
			+ '<div class="epc-vc-cat-icon">' + iconHtml(node.DES) + '</div>'
			+ '<div class="epc-pc-cat-name">'
			+ '<strong>' + esc(node.DES) + '</strong>'
			+ '<small style="display:block;color:#64748b;font-size:11px;font-weight:600;margin-top:4px">' + esc(meta) + '</small>'
			+ '</div>'
			+ '</button>';
	}

	function renderGrid() {
		var parent = state.path.length ? state.path[state.path.length - 1] : null;
		var nodes = parent ? (parent.CHILD || []) : state.tree;
		var title = parent ? parent.DES : 'Catalog';
		var back = parent
			? '<div class="epc-pf-cat-backbar"><button type="button" class="btn btn-default btn-sm" id="epc-pc-back"><i class="fa fa-arrow-left"></i> Back</button>'
				+ '<span class="epc-pf-cat-meta">' + esc(nodes.length) + ' subcategories</span></div>'
			: '';
		var cards = nodes.length
			? '<div class="epc-cm-catalog-head"><h1><em>' + esc(title) + '</em> by category</h1></div>'
				+ '<div class="epc-cm-cat-filter"><i class="fa fa-search" aria-hidden="true"></i>'
				+ '<input type="search" class="form-control" id="epc-pc-grid-filter" placeholder="Search for a category." autocomplete="off"></div>'
				+ '<div class="epc-vc-cat-grid">' + nodes.map(cardHtml).join('') + '</div>'
			: '<div class="epc-pf-msg">No subcategories.</div>';
		return back + cards;
	}

	function renderParts() {
		var p = state.parts || { groups: [], parts: [] };
		var stockRows = (p.stock || []).map(function (s) {
			return { SUP_BRAND: s.brand, ARTICLE_NR: s.article, ART_PRODUCT_NAME: s.name, QTY: s.qty, OWN: true };
		});
		var have = {};
		stockRows.forEach(function (r) { have[(r.SUP_BRAND + '|' + normArticle(r.ARTICLE_NR)).toUpperCase()] = true; });
		var rows = stockRows.concat((p.parts || []).filter(function (r) {
			return !have[((r.SUP_BRAND || r.SUP_ID || '') + '|' + normArticle(r.ARTICLE_NR)).toUpperCase()];
		}));
		var leafName = state.leaf ? state.leaf.DES : '';
		var back = '<div class="epc-pf-cat-backbar">'
			+ '<button type="button" class="btn btn-default btn-sm" id="epc-pc-back"><i class="fa fa-arrow-left"></i> Back</button>'
			+ '<span class="epc-pf-cat-meta">' + esc(leafName) + ' · ' + esc(rows.length) + ' articles'
			+ (rows.length >= 500 ? ' (first 500 shown — catalog cap)' : '') + '</span></div>';
		if (!rows.length) {
			return back + '<div class="epc-pf-msg">No articles found in this category.</div>';
		}
		var body = rows.map(function (r) {
			var brand = r.SUP_BRAND || r.SUP_ID || '';
			var search = [brand, r.ARTICLE_NR, r.ART_PRODUCT_NAME].join(' ');
			return '<tr data-search="' + esc(search) + '"><td>'
				+ '<img alt="" loading="lazy" style="max-height:22px;max-width:90px;object-fit:contain;vertical-align:middle;margin-right:8px" src="/api/umapi_image.php?kind=supplier&id=' + encodeURIComponent(brand) + '" onerror="this.remove()">'
				+ '<strong>' + esc(brand) + '</strong>'
				+ (r.OWN ? ' <span style="background:#dcfce7;color:#166534;border-radius:4px;padding:0 5px;font-size:10px">stock</span>' : '')
				+ '</td>'
				+ '<td><a href="' + esc(partUrl(brand, r.ARTICLE_NR)) + '">' + esc(r.ARTICLE_NR) + '</a></td>'
				+ '<td>' + esc(r.ART_PRODUCT_NAME) + '</td>'
				+ '<td>' + (r.QTY != null ? esc(Math.round(r.QTY)) : '') + '</td>'
				+ '<td><a class="btn btn-xs btn-primary" href="' + esc(partUrl(brand, r.ARTICLE_NR)) + '">Open</a></td></tr>';
		}).join('');
		return back
			+ '<div class="epc-cm-catalog-head"><h1><em>' + esc(leafName) + '</em></h1></div>'
			+ '<div class="epc-pf-panel">'
			+ '<input type="search" class="form-control" id="epc-pc-grid-filter" placeholder="Filter by article, brand or name…" style="margin-bottom:10px;max-width:360px;">'
			+ '<table class="epc-pf-table"><thead><tr><th>Brand</th><th>Article</th><th>Name</th><th>Qty</th><th></th></tr></thead>'
			+ '<tbody>' + body + '</tbody></table></div>';
	}

	function render() {
		if (state.loading) {
			mainEl.innerHTML = '<div class="epc-pf-loader"><i class="fa fa-spinner fa-spin"></i> ' + esc(state.loading) + '</div>';
			return;
		}
		mainEl.innerHTML = state.leaf ? renderParts() : renderGrid();
		bind();
	}

	function bind() {
		var back = document.getElementById('epc-pc-back');
		if (back) {
			back.onclick = function () {
				if (state.leaf) {
					state.leaf = null;
					state.parts = null;
				} else {
					state.path.pop();
				}
				render();
			};
		}
		var filter = document.getElementById('epc-pc-grid-filter');
		if (filter) {
			filter.oninput = function () {
				var q = String(filter.value || '').toLowerCase();
				Array.prototype.forEach.call(mainEl.querySelectorAll('[data-search]'), function (el) {
					el.style.display = (!q || (el.getAttribute('data-search') || '').toLowerCase().indexOf(q) !== -1) ? '' : 'none';
				});
			};
		}
		Array.prototype.forEach.call(mainEl.querySelectorAll('[data-cat]'), function (card) {
			card.onclick = function () {
				var id = card.getAttribute('data-cat');
				var parent = state.path.length ? state.path[state.path.length - 1] : null;
				var nodes = parent ? (parent.CHILD || []) : state.tree;
				var node = nodes.filter(function (n) { return String(n.CATEGORY_ID) === String(id); })[0];
				if (!node) { return; }
				if (node.CHILD && node.CHILD.length) {
					state.path.push(node);
					render();
				} else {
					state.leaf = node;
					state.loading = 'Loading articles for ' + node.DES + '…';
					render();
					Promise.all([
						api('catparts', { CATEGORY_ID: node.CATEGORY_ID }).catch(function () { return { groups: [], parts: [] }; }),
						loadStockParts(node.DES)
					]).then(function (rs) {
						state.loading = false;
						var data = rs[0];
						state.parts = (data && data.parts) ? data : { groups: [], parts: [] };
						state.parts.stock = rs[1];
						render();
					});
				}
			};
		});
	}

	// Map a TecDoc leaf name to the warehouse product-family label and load its
	// stock rows — always in full, bypassing the upstream 500-row catalog cap.
	function normLabel(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
	function loadStockParts(leafDes) {
		var labelsP = state.famLabels
			? Promise.resolve(state.famLabels)
			: fetch(FAMILY_API + '?action=summary', { credentials: 'same-origin' })
				.then(function (r) { return r.ok ? r.json() : null; })
				.then(function (d) {
					state.famLabels = (d && d.status && d.products) ? d.products.map(function (x) { return String(x.label || ''); }) : [];
					return state.famLabels;
				}).catch(function () { state.famLabels = []; return []; });
		return labelsP.then(function (labels) {
			var want = normLabel(leafDes);
			var label = null;
			labels.forEach(function (l) {
				var nl = normLabel(l);
				if (nl === want || nl === want + 's' || (want && want === nl + 's')) { label = l; }
			});
			if (!label) {
				// second pass: containment either way (e.g. 'Ball Joint' ~ 'Ball joints')
				labels.forEach(function (l) {
					var nl = normLabel(l);
					if (!label && want && nl && (nl.indexOf(want) !== -1 || want.indexOf(nl) !== -1)) { label = l; }
				});
			}
			if (!label) { return []; }
			return fetch(FAMILY_API + '?action=group&label=' + encodeURIComponent(label), { credentials: 'same-origin' })
				.then(function (r) { return r.ok ? r.json() : null; })
				.then(function (d) {
					var parts = (d && d.status && d.group && d.group.parts) ? d.group.parts : [];
					// Only keep stock rows that agree with the leaf name (a 'Brake Pad'
					// leaf must not inherit the whole 'Brake' family).
					var STOP = { brake:1, system:1, part:1, parts:1, the:1, and:1, of:1, assembly:1 };
					var keys = String(leafDes).toLowerCase().split(/[^a-z]+/)
						.filter(function (t) { return t.length > 1 && !STOP[t]; });
					if (!keys.length) { return parts; }
					return parts.filter(function (p) {
						var words = String(p.name || '').toLowerCase().split(/[^a-z0-9]+/);
						var joined = words.join('');
						var stemKeys = keys.map(function (k) { return k.replace(/s$/, ''); }).join('');
						return keys.every(function (k) {
							var ks = k.replace(/s$/, '');
							return words.some(function (w) { return w === k || w.replace(/s$/, '') === ks; });
						}) || (keys.length > 1 && joined.indexOf(stemKeys) !== -1);
					});
				})
				.catch(function () { return []; });
		});
	}

	state.loading = 'Loading product categories…';
	render();
	api('categories', { vehicle_type: 'CAR' }).then(function (data) {
		state.loading = false;
		state.tree = (data && data.root) ? data.root : [];
		render();
	}).catch(function () {
		state.loading = false;
		mainEl.innerHTML = '<div class="epc-pf-msg">Product categories are temporarily unavailable.</div>';
	});
})();
</script>
