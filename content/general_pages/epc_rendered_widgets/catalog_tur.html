<style>
.epc-umapi { margin: 0 0 30px; }
.epc-umapi-panel { background: #fff; border: 1px solid #e1e7ef; border-radius: 8px; padding: 16px; }
.epc-umapi-title { margin: 0 0 14px; font-size: 24px; font-weight: 700; color: #172536; }
.epc-umapi-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 18px; }
.epc-umapi-tab { border: 1px solid #d7dee9; background: #fff; border-radius: 6px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
.epc-umapi-tab.active { background: #2b78d6; border-color: #2b78d6; color: #fff; }
.epc-umapi-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.epc-umapi-toolbar input { min-width: 260px; max-width: 420px; }
.epc-umapi-vin-group { flex: 1 1 360px; max-width: 560px; }
.epc-umapi-vin-group input { text-transform: uppercase; letter-spacing: .04em; max-width: none; width: 100%; }
.epc-umapi-steps { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; color: #6d7786; }
.epc-umapi-step { background: #f1f4f8; border: 0; border-radius: 20px; padding: 6px 10px; font-size: 13px; color: #6d7786; }
.epc-umapi-step.active { background: #dcecff; color: #12579f; }
.epc-umapi-step.clickable { cursor: pointer; color: #1e67b1; }
.epc-umapi-summary { margin: -4px 0 14px; color: #657184; font-size: 13px; }
.epc-umapi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.epc-umapi-card { background: #fff; border: 1px solid #e1e7ef; border-radius: 8px; min-height: 76px; padding: 12px; cursor: pointer; transition: .15s ease; text-align: left; }
.epc-umapi-card:hover { border-color: #2b78d6; box-shadow: 0 4px 14px rgba(36,80,130,.12); }
.epc-umapi-card strong { display: block; color: #172536; }
.epc-umapi-card small { color: #758195; }
.epc-umapi-logo { max-height: 30px; max-width: 70px; margin-bottom: 8px; }
.epc-country-flag { width: 22px; height: 16px; object-fit: cover; border: 1px solid #e0e5ed; border-radius: 2px; margin-right: 5px; vertical-align: -3px; }
.epc-umapi-list { display: grid; gap: 9px; }
.epc-umapi-model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.epc-umapi-model-card { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; min-height: 160px; padding: 14px 10px 12px; text-align: center; border-radius: 10px; }
.epc-umapi-model-img { width: 100%; max-width: 150px; aspect-ratio: 4 / 3; object-fit: contain; }
.epc-umapi-mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.epc-umapi-mod-card { display: flex; flex-direction: column; gap: 8px; border-radius: 10px; }
.epc-umapi-modelfilter { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.epc-umapi-modelfilter select { max-width: 130px; }
.epc-umapi-letters { display: flex; flex-wrap: wrap; gap: 5px; }
.epc-umapi-letter { border: 1px solid #e1e7ef; background: #fff; color: #1e67b1; border-radius: 6px; min-width: 30px; min-height: 30px; font-weight: 700; cursor: pointer; padding: 0 8px; }
.epc-umapi-letter.active, .epc-umapi-letter:hover { background: #2b78d6; border-color: #2b78d6; color: #fff; }
.epc-umapi-modwrap { overflow-x: auto; border: 1px solid #e1e7ef; border-radius: 10px; }
.epc-umapi-modtable th { background: #f4f8ff; color: #29598f; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; text-align: left; }
.epc-umapi-modtable td strong { color: #1e67b1; }
.epc-umapi-mod-row { cursor: pointer; }
.epc-umapi-mod-row:hover td { background: #f4f8ff; }

.epc-umapi-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.epc-umapi-chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; background: #eef4fc; color: #29598f; font-size: 12px; font-weight: 600; }

.epc-umapi-row { background: #fff; border: 1px solid #e1e7ef; border-radius: 8px; padding: 12px; cursor: pointer; }
.epc-umapi-row:hover { border-color: #2b78d6; }
.epc-umapi-count { float: right; color: #657184; font-size: 13px; margin-top: 8px; }
.epc-umapi-alpha { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.epc-umapi-alpha a { display: inline-flex; min-width: 30px; min-height: 30px; align-items: center; justify-content: center; border: 1px solid #e1e7ef; border-radius: 6px; color: #1e67b1; background: #fff; font-weight: 600; }
.epc-umapi-alpha a:hover { text-decoration: none; border-color: #2b78d6; background: #f4f8ff; }
.epc-umapi-section { margin-top: 18px; }
.epc-umapi-section:first-child { margin-top: 0; }
.epc-umapi-section-title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 18px; font-weight: 700; color: #172536; }
.epc-umapi-section-title span { color: #657184; font-size: 13px; font-weight: 400; }
.epc-umapi-manufacturer-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.epc-umapi-manufacturer-card { min-height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; text-align: center; border-radius: 10px; }
.epc-umapi-manufacturer-card .epc-umapi-logo { margin: 0; max-height: 34px; max-width: 92px; }
.epc-umapi-manufacturer-card small { min-height: 18px; }
.epc-umapi-mini { min-height: 62px !important; padding: 8px 10px !important; position: relative; }
.epc-umapi-mini .epc-umapi-mini-flag { position: absolute; top: 8px; right: 8px; }
.epc-umapi-mini .epc-umapi-mini-flag img { display: block; width: 22px; height: 17px; }
.epc-umapi-mini strong { font-size: 13px; }
.epc-umapi-mini small { text-transform: lowercase; }
.epc-umapi-tree ul { list-style: none; padding-left: 18px; }
.epc-umapi-tree .epc-cat-node { list-style: none; }
.epc-cat-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.epc-cat-toggle { border: 0; background: transparent; color: #1e67b1; font-weight: 700; width: 18px; padding: 0; cursor: pointer; font-size: 14px; }
.epc-cat-icon { width: 22px; height: 22px; object-fit: contain; }
.epc-cat-children { padding-left: 30px; }

.epc-umapi-tree li { margin: 5px 0; }
.epc-umapi-tree button { border: 0; background: transparent; color: #1e67b1; padding: 3px 0; text-align: left; }
.epc-umapi-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.epc-umapi-products button { white-space: normal; text-align: left; }
.epc-art-brand { background: #fdf0e4; color: #e07b39; font-weight: 700; letter-spacing: .04em; padding: 8px 14px; border-radius: 4px; margin: 14px 0 0; display: flex; align-items: center; gap: 10px; }
.epc-art-brand img { max-height: 26px; max-width: 110px; object-fit: contain; background: #fff; border-radius: 3px; padding: 2px 6px; }
.epc-umapi-card img { display: block; max-height: 30px; max-width: 110px; object-fit: contain; margin: 0 auto 6px; }
.epc-art-card { display: flex; align-items: center; gap: 16px; border: 1px solid #e7edf5; border-radius: 6px; padding: 14px 16px; margin-top: 6px; background: #fff; }
.epc-art-thumb { flex: 0 0 110px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
.epc-art-img { max-width: 110px; max-height: 90px; object-fit: contain; }
.epc-art-body { flex: 1 1 auto; min-width: 0; }
.epc-art-title { font-size: 17px; font-weight: 700; color: #1e67b1; text-decoration: none; }
.epc-art-title small { color: #6d7786; font-weight: 600; }
.epc-art-name { color: #3d4a5c; margin: 2px 0 6px; }
.epc-art-specs { font-size: 13px; color: #4d5a6c; line-height: 1.7; }
.epc-art-specs span { margin-right: 14px; white-space: nowrap; }
.epc-art-prices { flex: 0 0 auto; border: 1px solid #e07b39; color: #e07b39; border-radius: 4px; padding: 7px 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.epc-art-prices:hover { background: #e07b39; color: #fff; }
.epc-cat-row.epc-cat-active { outline: 1px solid #e07b39; border-radius: 4px; }
.epc-umapi-table { width: 100%; border-collapse: collapse; background: #fff; }
.epc-umapi-table th, .epc-umapi-table td { border: 1px solid #e1e7ef; padding: 8px; vertical-align: top; }
.epc-umapi-table th { background: #f5f7fa; }
.epc-umapi-message { padding: 14px; background: #fff8e1; border: 1px solid #f0d98a; border-radius: 8px; }
.epc-umapi-loader { padding: 18px; text-align: center; color: #657184; }
@media (max-width: 767px) {
    .epc-umapi-grid { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); }
    .epc-umapi-toolbar input { min-width: 100%; }
}
</style>

<div class="epc-umapi" id="epc-umapi" data-lang-href="/en">
    <h1 class="epc-umapi-title">Catalog</h1>
    <div class="epc-umapi-tabs">
        <button type="button" class="epc-umapi-tab" data-section="passenger">Passenger</button>
        <button type="button" class="epc-umapi-tab" data-section="commercial">Commercial</button>
        <button type="button" class="epc-umapi-tab" data-section="motorbike">Motorbike</button>
        <select id="epc-umapi-countrysel" class="form-control epc-umapi-countrysel" style="display:none" aria-label="Filter by country"><option value="">Country</option></select>
    </div>

    <div class="epc-umapi-toolbar">
        <div class="input-group epc-umapi-vin-group">
            <input type="search" class="form-control" id="epc-umapi-vin" placeholder="VIN, e.g. WBAXG1103CDW29096" maxlength="17" autocomplete="off">
            <span class="input-group-btn"><button class="btn btn-success" type="button" id="epc-umapi-vin-btn">VIN search</button></span>
        </div>
        <input type="search" class="form-control" id="epc-umapi-filter" placeholder="Filter current list">
        <div class="input-group" style="max-width:420px;">
            <input type="search" class="form-control" id="epc-umapi-article" placeholder="Search article / OEM / analog">
            <span class="input-group-btn"><button class="btn btn-primary" type="button" id="epc-umapi-article-btn">Search</button></span>
        </div>
    </div>

    <div class="epc-umapi-steps" id="epc-umapi-steps"></div>
    <div class="epc-umapi-panel" id="epc-umapi-output"></div>
</div>

<script>
(function () {
    'use strict';

    var root = document.getElementById('epc-umapi');
    if (!root) {
        return;
    }

    var output = document.getElementById('epc-umapi-output');
    var steps = document.getElementById('epc-umapi-steps');
    var filterInput = document.getElementById('epc-umapi-filter');
    var countrySel = document.getElementById('epc-umapi-countrysel');
    var articleInput = document.getElementById('epc-umapi-article');
    var articleButton = document.getElementById('epc-umapi-article-btn');
    var vinInput = document.getElementById('epc-umapi-vin');
    var vinButton = document.getElementById('epc-umapi-vin-btn');
    var langHref = root.getAttribute('data-lang-href') || '';
    var epcUmapiChpuOn = false;
    var epcUmapiChpuPartsUrl = "parts";
    var epcUmapiChpuBrandsUrl = "brands";
    var epcUmapiChpuSlashCode = "%2F";
    var state = {
        section: 'passenger',
        manufacturer: null,
        model: null,
        modification: null,
        categories: null,
        vehicleType: ''
    };

    var sectionLabels = {
        passenger: 'Passenger',
        commercial: 'Commercial',
        motorbike: 'Motorbike'
    };

    function api(action, params) {
        var query = new URLSearchParams();
        query.set('action', action);
        query.set('section', state.section);
        query.set('language', 'en');
        query.set('region', 'WWW');
        if (state.vehicleType && ['models', 'modifications', 'categories', 'products', 'articles'].indexOf(action) !== -1) {
            query.set('vehicle_type', state.vehicleType);
        }
        Object.keys(params || {}).forEach(function (key) {
            if (params[key] !== undefined && params[key] !== null && params[key] !== '') {
                query.set(key, params[key]);
            }
        });
        return fetch('/api/emsh_proxy.php?' + query.toString(), { credentials: 'same-origin' }).then(function (response) {
            return response.json().then(function (data) {
                if (!response.ok) {
                    throw data;
                }
                return data;
            });
        });
    }

    function text(value) {
        return String(value === null || value === undefined ? '' : value);
    }

    function esc(value) {
        return text(value).replace(/[&<>"']/g, function (ch) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[ch];
        });
    }

    function cleanDate(value) {
        value = text(value);
        if (/^(none|null)$/i.test(value)) { return ''; }
        return value ? value.replace(/-01$/, '').replace(/-00$/, '') : '';
    }

    function countryCode(country) {
        var key = text(country).trim().toLowerCase();
        var map = {
            'япония': 'jp', 'japan': 'jp',
            'германия': 'de', 'germany': 'de',
            'сша': 'us', 'usa': 'us', 'united states': 'us',
            'италия': 'it', 'italy': 'it',
            'великобритания': 'gb', 'great britain': 'gb', 'united kingdom': 'gb',
            'китай': 'cn', 'china': 'cn',
            'франция': 'fr', 'france': 'fr',
            'южная корея': 'kr', 'south korea': 'kr',
            'россия': 'ru', 'russia': 'ru',
            'румыния': 'ro', 'romania': 'ro',
            'чехия': 'cz', 'czech republic': 'cz',
            'швеция': 'se', 'sweden': 'se',
            'украина': 'ua', 'ukraine': 'ua',
            'бельгия': 'be', 'belgium': 'be',
            'бразилия': 'br', 'brazil': 'br',
            'индия': 'in', 'india': 'in',
            'турция': 'tr', 'turkey': 'tr',
            'иран': 'ir', 'iran': 'ir',
            'чехословакия': 'cz',
            'испания': 'es', 'spain': 'es',
            'сербия': 'rs', 'serbia': 'rs',
            'аргентина': 'ar', 'argentina': 'ar',
            'австрия': 'at', 'austria': 'at',
            'ссср': 'ru'
        };
        return map[key] || '';
    }

    function flagHtml(country) {
        var code = countryCode(country);
        if (!code) {
            return esc(countryLabel(country));
        }
        return '<img class="epc-country-flag" alt="" src="https://flagcdn.com/24x18/' + code + '.png">' + esc(countryLabel(country));
    }

    var COUNTRY_LABELS = {
        'япония': 'Japan', 'германия': 'Germany', 'сша': 'USA', 'италия': 'Italy',
        'великобритания': 'United Kingdom', 'китай': 'China', 'франция': 'France',
        'южная корея': 'South Korea', 'россия': 'Russia', 'румыния': 'Romania',
        'чехия': 'Czech Republic', 'швеция': 'Sweden', 'украина': 'Ukraine',
        'бельгия': 'Belgium', 'бразилия': 'Brazil', 'индия': 'India',
        'турция': 'Turkey', 'иран': 'Iran', 'чехословакия': 'Czechoslovakia',
        'испания': 'Spain', 'сербия': 'Serbia', 'аргентина': 'Argentina',
        'австрия': 'Austria', 'ссср': 'USSR', 'австралия': 'Australia',
        'венесуэла': 'Venezuela', 'вьетнам': 'Vietnam', 'египет': 'Egypt',
        'индонезия': 'Indonesia', 'ирак': 'Iraq', 'канада': 'Canada',
        'малайзия': 'Malaysia', 'мексика': 'Mexico', 'польша': 'Poland',
        'португалия': 'Portugal', 'тайвань': 'Taiwan', 'таиланд': 'Thailand',
        'венгрия': 'Hungary', 'дания': 'Denmark', 'нидерланды': 'Netherlands',
        'норвегия': 'Norway', 'финляндия': 'Finland', 'швейцария': 'Switzerland',
        'юар': 'South Africa', 'новая зеландия': 'New Zealand', 'пакистан': 'Pakistan',
        'оаэ': 'UAE', 'саудовская аравия': 'Saudi Arabia', 'израиль': 'Israel'
    };
    function countryLabel(country) {
        var key = String(country || '').trim().toLowerCase();
        return COUNTRY_LABELS[key] || String(country || '').trim();
    }

    function apiItems(data) {
        if (Array.isArray(data)) {
            return data;
        }
        if (data && Array.isArray(data.data)) {
            return data.data;
        }
        return [];
    }

    function apiObject(data) {
        if (!data || typeof data !== 'object') {
            return data;
        }
        if (data.data && typeof data.data === 'object' && !Array.isArray(data.data)) {
            return data.data;
        }
        return data;
    }

    function loading(message) {
        output.innerHTML = '<div class="epc-umapi-loader">' + esc(message || 'Loading catalog data...') + '</div>';
    }

    function showError(error) {
        var message = error && error.message ? error.message : 'Catalog data is temporarily unavailable.';
        output.innerHTML = '<div class="epc-umapi-message">' + esc(message) + '</div>';
    }

    function setHash(section) {
        if (location.hash !== '#/' + section) {
            location.hash = '#/' + section;
        }
    }

    function syncTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.epc-umapi-tab'), function (tab) {
            tab.classList.toggle('active', tab.getAttribute('data-section') === state.section);
        });
    }

    function renderSteps(active) {
        var items = [
            ['manufacturers', sectionLabels[state.section]],
            ['models', state.manufacturer ? state.manufacturer.MANUFACTURER : 'Model'],
            ['modifications', state.model ? state.model.MODEL_SERIES : 'Modification'],
            ['categories', state.modification ? getModificationTitle(state.modification) : 'Parts'],
        ];
        steps.innerHTML = items.map(function (item) {
            var canClick = item[0] === 'manufacturers' || (item[0] === 'models' && state.manufacturer) || (item[0] === 'modifications' && state.model) || (item[0] === 'categories' && state.modification);
            return '<button type="button" class="epc-umapi-step ' + (item[0] === active ? 'active ' : '') + (canClick ? 'clickable' : '') + '" data-step="' + esc(item[0]) + '">' + esc(item[1]) + '</button>';
        }).join('');
        Array.prototype.forEach.call(steps.querySelectorAll('[data-step]'), function (button) {
            button.onclick = function () {
                var step = button.getAttribute('data-step');
                if (step === 'manufacturers') {
                    loadManufacturers();
                } else if (step === 'models' && state.manufacturer) {
                    loadModels(state.manufacturer);
                } else if (step === 'modifications' && state.model) {
                    loadModifications(state.model);
                } else if (step === 'categories' && state.modification && state.categories) {
                    renderCategories(state.categories);
                }
            };
        });
    }

    function getModificationId(item) {
        return item.PC_ID || item.CV_ID || item.MTB_ID || item.ID || item.MOD_ID || '';
    }

    function getModificationTitle(item) {
        return item.PASSENGER_CAR || item.COMMERCIAL_VEHICLE || item.MOTORBIKE || item.MODIFICATION || item.DES || item.MODEL_SERIES || 'Selected vehicle';
    }

    function chooseVehicleType(item) {
        var types = item && item.EPART_TYPES ? item.EPART_TYPES : [];
        return types.length ? types[0] : '';
    }

    function listSummary(label, items) {
        return '<div class="epc-umapi-summary">' + esc(label) + '<span class="epc-umapi-count">' + esc((items || []).length) + ' found</span></div>';
    }

    function popularFlag(item) {
        if (state.section === 'commercial') {
            return item.POPULAR_CV;
        }
        if (state.section === 'motorbike') {
            return item.POPULAR_MTB;
        }
        return item.POPULAR_PC;
    }

    function isPopularManufacturer(item) {
        return String(popularFlag(item)) === '1';
    }

    function manufacturerLetter(item) {
        var name = text(item.MANUFACTURER).trim();
        var letter = name ? name.charAt(0).toUpperCase() : '#';
        return /^[A-Z]$/.test(letter) ? letter : '0-9';
    }

    function manufacturerCard(item, index) {
        var logo = item.EPC_LOGO ? '<img class="epc-umapi-logo" alt="" src="' + item.EPC_LOGO + '" onerror="this.style.display=\'none\';">' : '';
        return '<div class="epc-umapi-card epc-umapi-manufacturer-card" data-index="' + index + '" data-ccode="' + esc(countryCode(item.COUNTRY || '') || '') + '" data-search="' + esc(item.MANUFACTURER + ' ' + item.COUNTRY) + '">' +
            logo + '<strong>' + esc(item.MANUFACTURER) + '</strong><small>' + flagHtml(item.COUNTRY || '') + '</small></div>';
    }

    function manufacturerMiniCard(item, index) {
        var code = countryCode(item.COUNTRY || '');
        var flag = code ? '<span class="epc-umapi-mini-flag"><img alt="" src="https://flagcdn.com/24x18/' + code + '.png"></span>' : '';
        var sub = String(item.MANUFACTURER || '').toLowerCase();
        if (!code && item.COUNTRY) { sub += ' · ' + countryLabel(item.COUNTRY); }
        return '<div class="epc-umapi-card epc-umapi-manufacturer-card epc-umapi-mini" data-index="' + index + '" data-ccode="' + esc(code || '') + '" data-search="' + esc(item.MANUFACTURER + ' ' + item.COUNTRY) + '">' +
            flag + '<strong>' + esc(item.MANUFACTURER) + '</strong><small>' + esc(sub) + '</small></div>';
    }

    function manufacturerGrid(list, allItems, mini) {
        return '<div class="epc-umapi-grid epc-umapi-manufacturer-grid">' + list.map(function (item) {
            return mini ? manufacturerMiniCard(item, allItems.indexOf(item)) : manufacturerCard(item, allItems.indexOf(item));
        }).join('') + '</div>';
    }

    function applyFilter() {
        var term = filterInput.value.toLowerCase();
        Array.prototype.forEach.call(output.querySelectorAll('[data-search]'), function (node) {
            node.style.display = node.getAttribute('data-search').toLowerCase().indexOf(term) === -1 ? 'none' : '';
        });
        if (typeof applyCountryFilter === 'function') { applyCountryFilter(); }
    }

    function renderManufacturers(items) {
        items = apiItems(items);
        renderSteps('manufacturers');
        if (!items || !items.length) {
            output.innerHTML = '<div class="epc-umapi-message">No manufacturers found.</div>';
            return;
        }
        var popular = items.filter(isPopularManufacturer);
        var other = items.filter(function (item) { return !isPopularManufacturer(item); });
        var groups = {};
        other.forEach(function (item) {
            var letter = manufacturerLetter(item);
            if (!groups[letter]) {
                groups[letter] = [];
            }
            groups[letter].push(item);
        });
        var letters = Object.keys(groups).sort();
        var html = listSummary('Select vehicle brand. Popular manufacturers are shown first, then all other manufacturers alphabetically.', items);
        if (popular.length) {
            html += '<div class="epc-umapi-section"><h3 class="epc-umapi-section-title">Popular manufacturers <span>' + esc(popular.length) + '</span></h3>' + manufacturerGrid(popular, items) + '</div>';
        }
        if (letters.length) {
            html += '<div class="epc-umapi-section"><h3 class="epc-umapi-section-title">Other manufacturers <span>A-Z</span></h3><div class="epc-umapi-alpha">' +
                letters.map(function (letter) { return '<a href="#epc-letter-' + esc(letter) + '">' + esc(letter) + '</a>'; }).join('') + '</div></div>';
            letters.forEach(function (letter) {
                html += '<div class="epc-umapi-section" id="epc-letter-' + esc(letter) + '"><h3 class="epc-umapi-section-title">' + esc(letter) + ' <span>' + esc(groups[letter].length) + '</span></h3>' + manufacturerGrid(groups[letter], items, true) + '</div>';
            });
        }
        output.innerHTML = html;
        bindIndexed('.epc-umapi-card', items, loadModels);
        applyFilter();
        if (countrySel) {
            var codes = {};
            items.forEach(function (item) {
                var c = countryCode(item.COUNTRY || '') || '';
                var label = countryLabel(item.COUNTRY);
                if (c && label && !codes[c]) { codes[c] = label; }
            });
            var sorted = Object.keys(codes).sort(function (a, b) { return codes[a].localeCompare(codes[b]); });
            countrySel.innerHTML = '<option value="">Country (' + sorted.length + ')</option>' +
                sorted.map(function (c) { return '<option value="' + esc(c) + '">' + esc(codes[c]) + '</option>'; }).join('');
            countrySel.value = '';
            countrySel.style.display = sorted.length ? 'inline-block' : 'none';
            countrySel.onchange = applyCountryFilter;
        }
    }

    function applyCountryFilter() {
        if (!countrySel) { return; }
        var want = countrySel.value;
        var term = filterInput ? filterInput.value.toLowerCase() : '';
        var cards = output.querySelectorAll('.epc-umapi-manufacturer-card');
        for (var i = 0; i < cards.length; i++) {
            var c = cards[i].getAttribute('data-ccode') || '';
            var hay = (cards[i].getAttribute('data-search') || '').toLowerCase();
            var hide = (want && c !== want) || (term && hay.indexOf(term) === -1);
            cards[i].style.display = hide ? 'none' : '';
        }
    }

    function hideCountryFilter() {
        if (countrySel) { countrySel.style.display = 'none'; countrySel.value = ''; }
    }

    function renderModels(items) {
        items = apiItems(items);
        renderSteps('models');
        if (!items || !items.length) {
            output.innerHTML = '<div class="epc-umapi-message">No models found for this manufacturer.</div>';
            return;
        }
        var years = {};
        var maxYear = Math.min(new Date().getFullYear() + 1, 2027);
        items.forEach(function (item) {
            var from = parseInt((item.CI_FROM || '').slice(0, 4), 10);
            var to = parseInt((item.CI_TO || '').slice(0, 4), 10);
            if (!to || to > maxYear) { to = maxYear; }
            for (var y = from; y <= to && y > 1900; y++) { years[y] = true; }
        });
        var yearOpts = Object.keys(years).sort(function (a, b) { return b - a; })
            .map(function (y) { return '<option value="' + y + '">' + y + '</option>'; }).join('');
        var letters = {};
        items.forEach(function (item) {
            var c = (item.MODEL_SERIES || '').trim().charAt(0).toUpperCase();
            if (/^[A-Z0-9]$/.test(c)) { letters[c] = true; }
        });
        var letterBtns = ['<button type="button" class="epc-umapi-letter active" data-letter="">All</button>']
            .concat(Object.keys(letters).sort().map(function (c) {
                return '<button type="button" class="epc-umapi-letter" data-letter="' + c + '">' + c + '</button>';
            })).join('');
        var toolbar = '<div class="epc-umapi-modelfilter"><select id="epc-umapi-yearsel" class="form-control"><option value="">Year</option>' +
            yearOpts + '</select><div class="epc-umapi-letters">' + letterBtns + '</div></div>';
        output.innerHTML = listSummary('Select model series for ' + (state.manufacturer ? state.manufacturer.MANUFACTURER : 'selected brand') + '.', items) + toolbar + '<div class="epc-umapi-model-grid">' + items.map(function (item, index) {
            var years = cleanDate(item.CI_FROM);
            if (years) { years += cleanDate(item.CI_TO) ? ' \u2014 ' + cleanDate(item.CI_TO) : ' \u2014 p.t.'; }
            var img = item.EPC_LOGO ? '<img class="epc-umapi-model-img" alt="" loading="lazy" src="' + item.EPC_LOGO + '" onerror="this.remove()">' : '';
            var yFrom = parseInt((item.CI_FROM || '').slice(0, 4), 10) || 0;
            var yTo = parseInt((item.CI_TO || '').slice(0, 4), 10) || 9999;
            var first = (item.MODEL_SERIES || '').trim().charAt(0).toUpperCase();
            return '<div class="epc-umapi-card epc-umapi-model-card" data-index="' + index + '" data-letter="' + esc(first) + '" data-yfrom="' + yFrom + '" data-yto="' + yTo + '" data-search="' + esc(item.MODEL_SERIES + ' ' + years) + '">' +
                img + '<strong>' + esc(item.MODEL_SERIES) + '</strong>' + (years ? '<span class="epc-umapi-chip">' + esc(years) + '</span>' : '') + '</div>';
        }).join('') + '</div>';
        bindIndexed('.epc-umapi-model-card', items, loadModifications);
        var yearSel = document.getElementById('epc-umapi-yearsel');
        var activeLetter = '';
        function applyModelFilter() {
            var y = yearSel && yearSel.value ? parseInt(yearSel.value, 10) : 0;
            Array.prototype.forEach.call(output.querySelectorAll('.epc-umapi-model-card'), function (card) {
                var okL = !activeLetter || card.getAttribute('data-letter') === activeLetter;
                var okY = !y || (parseInt(card.getAttribute('data-yfrom'), 10) <= y && y <= parseInt(card.getAttribute('data-yto'), 10));
                card.style.display = (okL && okY) ? '' : 'none';
            });
        }
        if (yearSel) { yearSel.onchange = applyModelFilter; }
        Array.prototype.forEach.call(output.querySelectorAll('.epc-umapi-letter'), function (btn) {
            btn.onclick = function () {
                activeLetter = btn.getAttribute('data-letter') || '';
                Array.prototype.forEach.call(output.querySelectorAll('.epc-umapi-letter'), function (b) {
                    b.classList.toggle('active', b === btn);
                });
                applyModelFilter();
            };
        });
        applyFilter();
    }

    function renderModifications(items) {
        items = apiItems(items);
        renderSteps('modifications');
        if (!items || !items.length) {
            output.innerHTML = '<div class="epc-umapi-message">No modifications found for this model.</div>';
            return;
        }
        output.innerHTML = listSummary('Select exact vehicle modification.', items) + '<div class="epc-umapi-modwrap"><table class="epc-umapi-table epc-umapi-modtable"><thead><tr>' +
            '<th>L.</th><th>Model</th><th>Year</th><th>Engine type</th><th>Power</th><th>Drive</th></tr></thead><tbody>' + items.map(function (item, index) {
            var litres = item.CAPACITY_LT || (item.CAPACITY_TECH ? item.CAPACITY_TECH / 1000 : 0);
            litres = litres ? (Math.round(litres * 100) / 100).toFixed(2).replace(/0+$/, '').replace(/\.$/, '') : '';
            var yearFrom = (item.CI_FROM || '').slice(0, 4);
            var yearTo = (item.CI_TO || '').slice(0, 4);
            var years = yearFrom + (yearTo ? ' \u2014 ' + yearTo : ' \u2014 p.t.');
            var engine = item.ENGINE_TYPE || item.FUEL_TYPE || '';
            var kw = item.POWER_KW || item.POWER_KW_START;
            kw = kw ? Math.round(kw) : 0;
            var ps = item.POWER_PS || item.POWER_PS_START;
            ps = ps ? Math.round(ps) : 0;
            var power = kw ? kw + 'Kw' + (ps ? ' / ' + ps + 'Hp' : '') : '';
            var drive = item.DRIVE_TYPE || item.AXLE_CONFIGURATION || '';
            var search = [(state.model && state.model.MODEL_SERIES) || '', getModificationTitle(item), litres, years, engine, power, drive].join(' ');
            return '<tr class="epc-umapi-mod-row" data-index="' + index + '" data-search="' + esc(search) + '">' +
                '<td>' + esc(litres) + '</td><td><strong>' + esc(getModificationTitle(item)) + '</strong></td><td>' + esc(years) + '</td>' +
                '<td>' + esc(engine) + '</td><td>' + esc(power) + '</td><td>' + esc(drive) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
        Array.prototype.forEach.call(output.querySelectorAll('.epc-umapi-mod-row'), function (row) {
            row.onclick = function () { loadCategories(items[parseInt(row.getAttribute('data-index'), 10)]); };
        });
        applyFilter();
    }

    function catIconKey(des) {
        var d = String(des || '').toLowerCase();
        if (/body|chassis|frame|kaross|panel|door|bumper|hood|roof|mirror|glass|exterior/.test(d)) { return 'body'; }
        if (/engine|motor|mount|cylinder|crank|cam|valve|piston|gasket/.test(d)) { return 'engine'; }
        if (/drive ?train|transmiss|clutch|axle|gearbox|differential|propeller|cardan|belt/.test(d)) { return 'drivetrain'; }
        if (/filter/.test(d)) { return 'filter'; }
        if (/window|windshield|wiper|cleaning/.test(d)) { return 'windows'; }
        if (/fuel|mixture|injection|carbure|tank|pump/.test(d)) { return 'fuel'; }
        if (/suspens|shock|spring|absorb/.test(d)) { return 'suspension'; }
        if (/brak/.test(d)) { return 'brakes'; }
        if (/exhaust|muffler|catalyst/.test(d)) { return 'exhaust'; }
        if (/cool|air ?condition|heating|ventilat|climate|radiator/.test(d)) { return 'cooling'; }
        if (/steer/.test(d)) { return 'steering'; }
        if (/interior|seat|cabin|trim|dashboard|console/.test(d)) { return 'interior'; }
        if (/light|lamp|headl|bulb|signal/.test(d)) { return 'lights'; }
        if (/electric|battery|wir|alternator|starter|sensor/.test(d)) { return 'electrics'; }
        if (/ignit|spark|glow/.test(d)) { return 'ignition'; }
        if (/accessor|component|other|misc/.test(d)) { return 'accessories'; }
        if (/service|maint|care|repair|tool|lubric|oil/.test(d)) { return 'service'; }
        return 'components';
    }
    function catIcon(des, level) {
        if (level > 1) { return ''; }
        var key = catIconKey(des);
        return EPC_CAT_ICONS[key] ? '<img class="epc-cat-icon" alt="" src="' + EPC_CAT_ICONS[key] + '">' : '';
    }

    function renderCategoryTree(nodes, level) {
        if (!nodes || !nodes.length || level > 5) {
            return '';
        }
        return '<ul class="epc-cat-level-' + level + '">' + nodes.map(function (node) {
            var children = node.CHILD || node.children || [];
            var des = node.DES || 'Category';
            var toggle = children.length
                ? '<button type="button" class="epc-cat-toggle" aria-expanded="false">+</button>'
                : '<span class="epc-cat-toggle" aria-hidden="true">–</span>';
            return '<li class="epc-cat-node" data-search="' + esc(des) + '">' +
                '<span class="epc-cat-row">' + toggle + catIcon(des, level) +
                '<button type="button" data-category="' + esc(node.CATEGORY_ID) + '">' + esc(des) + '</button></span>' +
                (children.length ? '<span class="epc-cat-children" hidden>' + renderCategoryTree(children, level + 1) + '</span>' : '') +
            '</li>';
        }).join('') + '</ul>';
    }

    function renderCategories(data) {
        data = apiObject(data) || {};
        renderSteps('categories');
        if (!data || (!data.root && !data.quic)) {
            output.innerHTML = '<div class="epc-umapi-message">No categories found for this vehicle.</div>';
            return;
        }
        var quick = data.quic || [];
        var html = '';
        if (quick.length) {
            html += '<h3>Popular groups</h3><div class="epc-umapi-grid">' + quick.map(function (item) {
                var id = item.CATEGORY_IDS && item.CATEGORY_IDS.length ? item.CATEGORY_IDS[0] : item.CATEGORY_ID;
                return '<div class="epc-umapi-card" data-category="' + esc(id) + '" data-search="' + esc(item.DES) + '">' + catIcon(item.DES, 0) + '<strong>' + esc(item.DES) + '</strong></div>';
            }).join('') + '</div>';
        }
        html += '<h3>All categories</h3><div class="epc-umapi-tree">' + renderCategoryTree(data.root || [], 0) + '</div>';
        output.innerHTML = html;
        bindCategoryButtons();
        applyFilter();
    }

    function renderProducts(items, categoryId) {
        items = apiItems(items);
        renderSteps('categories');
        if (!items || !items.length) {
            output.innerHTML = '<div class="epc-umapi-message">No product groups found for this vehicle in this category.</div>';
            return;
        }
        // UMAPI repeats each product row once per brand — dedupe by product id.
        var seen = {};
        items = items.filter(function (item) {
            var id = item.PT_ID || item.PT_IDS || item.ID;
            var key = String(id);
            if (seen[key]) { return false; }
            seen[key] = true;
            return true;
        });
        output.innerHTML = '<button type="button" class="btn btn-default" id="epc-umapi-back-categories">Back to categories</button><h3>Product groups</h3><div class="epc-umapi-products">' +
            items.map(function (item) {
                var id = item.PT_ID || item.PT_IDS || item.ID;
                var label = item.PT_DES || item.DES || item.PRODUCT_GROUP || item.PRODUCT || id;
                return '<button type="button" class="btn btn-default" data-product="' + esc(id) + '" data-search="' + esc(label) + '">' + esc(label) + '</button>';
            }).join('') + '</div>';
        document.getElementById('epc-umapi-back-categories').onclick = function () { renderCategories(state.categories); };
        Array.prototype.forEach.call(output.querySelectorAll('[data-product]'), function (button) {
            button.onclick = function () { loadArticles(button.getAttribute('data-product')); };
        });
        applyFilter();
    }

    function renderArticles(data) {
        var items = apiItems(data);
        if (!items || !items.length) {
            output.innerHTML = '<div class="epc-umapi-message">No articles found.</div>';
            return;
        }
        // Brand-grouped cards like the UMAPI catalog: brand header, drawing, part number,
        // inline key specs, "Find out prices" -> warehouse/shop search.
        var groups = [];
        var byBrand = {};
        items.forEach(function (item) {
            var brand = item.SUP_BRAND || item.BRAND || item.SUPPLIER || item.MANUFACTURER || '';
            if (!byBrand[brand]) {
                byBrand[brand] = [];
                groups.push(brand);
            }
            byBrand[brand].push(item);
        });
        groups.sort();
        output.innerHTML = '<button type="button" class="btn btn-default" id="epc-umapi-back-categories">Back to categories</button>' +
            groups.map(function (brand) {
                var supId = (byBrand[brand].find(function (i) { return i.SUP_ID; }) || {}).SUP_ID || '';
            var logo = supId ? '<img alt="" loading="lazy" src="/api/umapi_image.php?kind=supplier&id=' + encodeURIComponent(supId) + '" onerror="this.style.display=\'none\';">' : '';
            return '<div class="epc-art-brand">' + logo + esc(brand || 'Aftermarket') + '</div>' +
                    byBrand[brand].map(function (item) { return articleCard(item, brand); }).join('');
            }).join('');
        document.getElementById('epc-umapi-back-categories').onclick = function () { renderCategories(state.categories); };
    }

    function normalizeArticleForUrl(article) {
        return String(article || '').replace(/[\s\-_`\/'"\\.,#]/g, '').toUpperCase();
    }
    function shopSearchUrl(brand, article) {
        var articleNorm = normalizeArticleForUrl(article);
        var brandName = String(brand || '').trim();
        if (!articleNorm) {
            return langHref + '/shop/part_search';
        }
        if (epcUmapiChpuOn) {
            if (!brandName) {
                return langHref + '/' + epcUmapiChpuPartsUrl + '/' + epcUmapiChpuBrandsUrl + '/' + encodeURIComponent(articleNorm);
            }
            var manufacturerAlias = brandName.split('/').join(epcUmapiChpuSlashCode);
            return langHref + '/' + epcUmapiChpuPartsUrl + '/' + encodeURIComponent(manufacturerAlias) + '/' + encodeURIComponent(articleNorm);
        }
        var legacyUrl = langHref + '/shop/part_search?article=' + encodeURIComponent(articleNorm);
        if (brandName) {
            legacyUrl += '&brend=' + encodeURIComponent(brandName);
        }
        return legacyUrl;
    }
    function articleCard(item, brand) {
        var article = item.ART_ARTICLE_NR || item.ARTICLE_NR || item.ARTICLE || item.ART_NUMBER || item.OEN || '';
        var name = item.COMPLETE_DES || item.ART_PRODUCT_NAME || item.PRODUCT_NAME || item.DES || item.NAME || '';
        var file = item.MEDIA_FILE || (item.MEDIAS && item.MEDIAS.length ? item.MEDIAS[0].FILE_NAME : '');
        var img = file ? '<img class="epc-art-img" alt="" loading="lazy" src="/api/umapi_image.php?kind=article&id=' + encodeURIComponent(file) + '" onerror="this.remove()">' : '';
        var specs = (item.CRITERIAS || []).slice(0, 6).map(function (c) {
            return '<span><strong>' + esc(c.CRI_DES || c.CRI_SHORT_DES || '') + ':</strong> ' + esc(c.VALUE || c.DES || '') + '</span>';
        }).join(' ');
        var searchUrl = shopSearchUrl(brand, article);
        var productUrl = '/en/parts/' + encodeURIComponent(String(brand).toUpperCase()) + '/' + encodeURIComponent(article);
        return '<div class="epc-art-card" data-search="' + esc([brand, article, name].join(' ')) + '">' +
            '<a class="epc-art-thumb" href="' + esc(productUrl) + '">' + img + '</a>' +
            '<div class="epc-art-body"><a class="epc-art-title" href="' + esc(productUrl) + '">' + esc(article) + ' <small>' + esc(brand) + '</small></a>' +
            '<div class="epc-art-name">' + esc(name) + '</div>' +
            '<div class="epc-art-specs">' + specs + '</div></div>' +
            '<a class="epc-art-prices" href="' + esc(searchUrl) + '" title="Search ' + esc(brand) + ' ' + esc(article) + ' prices in our shop">Find out prices</a></div>';
    }

    function renderBrandSearch(items, article) {
        items = apiItems(items);
        if (!items || !items.length) {
            output.innerHTML = '<div class="epc-umapi-message">No brand found for this article.</div>';
            return;
        }
        output.innerHTML = '<h3>Choose brand for ' + esc(article) + '</h3><div class="epc-umapi-grid">' +
            items.map(function (item, index) {
                var brand = item.BRAND || item.SUP_BRAND || item.MANUFACTURER || item.BRAND_NAME || item.DES || '';
                var supId = item.SUP_ID || item.SUPPLIER_ID || '';
                var logo = supId ? '<img alt="" loading="lazy" src="/api/umapi_image.php?kind=supplier&id=' + encodeURIComponent(supId) + '" onerror="this.style.display=\'none\';">' : '';
                return '<div class="epc-umapi-card" data-index="' + index + '" data-search="' + esc(brand) + '">' + logo + '<strong>' + esc(brand) + '</strong></div>';
            }).join('') + '</div>';
        bindIndexed('.epc-umapi-card', items, function (item) {
            var brand = item.BRAND || item.SUP_BRAND || item.MANUFACTURER || item.BRAND_NAME || item.DES || '';
            // UMAPI's Analogs endpoint is broken upstream (500 on every call);
            // car-mod.com lands on the part detail page, and so do we.
            window.location.href = '/en/parts/' + encodeURIComponent(String(brand).toUpperCase()) +
                '/' + encodeURIComponent(article);
        });
    }

    function bindIndexed(selector, items, handler) {
        Array.prototype.forEach.call(output.querySelectorAll(selector), function (node) {
            node.onclick = function () {
                handler(items[parseInt(node.getAttribute('data-index'), 10)]);
            };
        });
    }

    function bindCategoryButtons() {
        Array.prototype.forEach.call(output.querySelectorAll('[data-category]'), function (node) {
            node.onclick = function () {
                Array.prototype.forEach.call(output.querySelectorAll('.epc-cat-row.epc-cat-active'), function (r) { r.classList.remove('epc-cat-active'); });
                var row = node.closest('.epc-cat-row');
                if (row) { row.classList.add('epc-cat-active'); }
                // Nodes with children expand/collapse instead of fetching products;
                // only leaf categories map to upstream product groups.
                var li = node.closest('.epc-cat-node');
                var kids = li ? li.querySelector(':scope > .epc-cat-children') : null;
                if (kids) {
                    var toggle = li.querySelector(':scope > .epc-cat-row > button.epc-cat-toggle');
                    var open = kids.hasAttribute('hidden');
                    if (open) { kids.removeAttribute('hidden'); if (toggle) { toggle.textContent = '\u2212'; toggle.setAttribute('aria-expanded', 'true'); } }
                    else { kids.setAttribute('hidden', ''); if (toggle) { toggle.textContent = '+'; toggle.setAttribute('aria-expanded', 'false'); } }
                    return;
                }
                loadProducts(node.getAttribute('data-category'));
            };
        });
        Array.prototype.forEach.call(output.querySelectorAll('button.epc-cat-toggle'), function (btn) {
            btn.onclick = function () {
                var kids = btn.parentNode.parentNode.querySelector('.epc-cat-children');
                if (!kids) { return; }
                var open = kids.hasAttribute('hidden');
                if (open) { kids.removeAttribute('hidden'); btn.textContent = '\u2212'; btn.setAttribute('aria-expanded', 'true'); }
                else { kids.setAttribute('hidden', ''); btn.textContent = '+'; btn.setAttribute('aria-expanded', 'false'); }
            };
        });
    }

    function loadManufacturers() {
        state.manufacturer = null;
        state.model = null;
        state.modification = null;
        state.categories = null;
        state.vehicleType = '';
        syncTabs();
        renderSteps('manufacturers');
        loading('Loading all manufacturers...');
        api('manufacturers', {}).then(renderManufacturers).catch(showError);
    }

    function loadModels(item) {
        if (filterInput) { filterInput.value = ''; }
        hideCountryFilter();
        state.manufacturer = item;
        state.model = null;
        state.modification = null;
        state.vehicleType = chooseVehicleType(item);
        loading('Loading models...');
        api('models', { MFA_ID: item.MFA_ID }).then(renderModels).catch(showError);
    }

    function loadModifications(item) {
        if (filterInput) { filterInput.value = ''; }
        hideCountryFilter();
        state.model = item;
        state.modification = null;
        loading('Loading modifications...');
        api('modifications', { MS_ID: item.MS_ID }).then(renderModifications).catch(showError);
    }

    function loadCategories(item) {
        if (filterInput) { filterInput.value = ''; }
        hideCountryFilter();
        state.modification = item;
        loading('Loading categories...');
        api('categories', { ID: getModificationId(item) }).then(function (data) {
            state.categories = apiObject(data) || {};
            renderCategories(state.categories);
        }).catch(showError);
    }

    function loadProducts(categoryId) {
        if (filterInput) { filterInput.value = ''; }
        hideCountryFilter();
        if (!state.modification) {
            return;
        }
        loading('Loading product groups...');
        api('products', { CATEGORY_ID: categoryId, ID: getModificationId(state.modification) }).then(function (items) {
            renderProducts(items, categoryId);
        }).catch(showError);
    }

    function loadArticles(productId) {
        if (filterInput) { filterInput.value = ''; }
        hideCountryFilter();
        if (!state.modification) {
            return;
        }
        loading('Loading articles...');
        api('articles', { PT_IDS: productId, ID: getModificationId(state.modification), limit: 200, offset: 0 }).then(renderArticles).catch(showError);
    }


    function normalizeVin(value) {
        return String(value || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    }

    function vinArray(node) {
        if (!node) { return []; }
        if (Array.isArray(node)) { return node; }
        if (node.array && Array.isArray(node.array)) { return node.array; }
        return [];
    }

    function mapVinSection(vehicle) {
        var type = String((vehicle && (vehicle.linkageTargetType || vehicle.subLinkageTargetType)) || 'P').toUpperCase();
        if (type === 'V' || type === 'CV' || type === 'C') { return 'commercial'; }
        if (type === 'M' || type === 'MTB' || type === 'B') { return 'motorbike'; }
        return 'passenger';
    }

    function applyVinVehicle(vehicle, manufacturers, models) {
        var manu = manufacturers.find(function (item) { return String(item.manuId) === String(vehicle.manuId); }) || {};
        var model = models.find(function (item) { return String(item.modelId) === String(vehicle.modelId); }) || {};
        state.section = mapVinSection(vehicle);
        setHash(state.section);
        syncTabs();
        state.manufacturer = {
            MFA_ID: vehicle.manuId,
            MANUFACTURER: manu.manuName || 'Vehicle',
            EPART_TYPES: [state.section === 'commercial' ? 'CV' : (state.section === 'motorbike' ? 'Motorcycle' : 'PC')]
        };
        state.vehicleType = chooseVehicleType(state.manufacturer) || (state.section === 'commercial' ? 'CV' : (state.section === 'motorbike' ? 'Motorcycle' : 'PC'));
        state.model = {
            MS_ID: vehicle.modelId,
            MODEL_SERIES: model.modelName || vehicle.carName || 'Model',
            MFA_ID: vehicle.manuId
        };
        loading('Loading vehicle modification...');
        api('modifications', { MS_ID: vehicle.modelId }).then(function (items) {
            var list = Array.isArray(items) ? items : [];
            var mod = list.find(function (row) {
                return String(getModificationId(row)) === String(vehicle.carId);
            });
            if (!mod) {
                mod = {
                    PC_ID: vehicle.carId,
                    PASSENGER_CAR: vehicle.vehicleTypeDescription || vehicle.carName || 'Vehicle',
                    MS_ID: vehicle.modelId,
                    MFA_ID: vehicle.manuId,
                    TYPE: state.vehicleType
                };
            }
            state.modification = mod;
            loadCategories(mod);
        }).catch(showError);
    }

    function renderVinVehiclePicker(vehicles, manufacturers, models, vin) {
        renderSteps('manufacturers');
        output.innerHTML = '<h3>Select vehicle for VIN ' + esc(vin) + '</h3><div class="epc-umapi-list">' +
            vehicles.map(function (vehicle, index) {
                var label = vehicle.carName || vehicle.vehicleTypeDescription || ('Vehicle ' + (index + 1));
                return '<div class="epc-umapi-row" data-vin-index="' + index + '"><strong>' + esc(label) + '</strong></div>';
            }).join('') + '</div>';
        Array.prototype.forEach.call(output.querySelectorAll('[data-vin-index]'), function (node) {
            node.onclick = function () {
                applyVinVehicle(vehicles[parseInt(node.getAttribute('data-vin-index'), 10)], manufacturers, models);
            };
        });
    }

    function vinSearch() {
        var vin = normalizeVin(vinInput ? vinInput.value : '');
        if (vin.length < 11) {
            if (vinInput) { vinInput.focus(); }
            showError({ message: 'Enter a valid VIN (11-17 characters).' });
            return;
        }
        if (vinInput) { vinInput.value = vin; }
        loading('Decoding VIN and loading catalog...');
        api('vin', { vin: vin }).then(function (payload) {
            var data = payload && payload.data ? payload.data : payload;
            var vehicles = vinArray(data && data.matchingVehicles);
            var manufacturers = vinArray(data && data.matchingManufacturers);
            var models = vinArray(data && data.matchingModels);
            if (!vehicles.length) {
                showError({ message: 'No vehicle found for this VIN.' });
                return;
            }
            if (vehicles.length === 1) {
                applyVinVehicle(vehicles[0], manufacturers, models);
                return;
            }
            renderVinVehiclePicker(vehicles, manufacturers, models, vin);
        }).catch(showError);
    }

    function initVinFromQuery() {
        var params = new URLSearchParams(location.search);
        var vin = normalizeVin(params.get('vin') || '');
        if (!vin) { return false; }
        if (vinInput) { vinInput.value = vin; }
        vinSearch();
        return true;
    }

    function articleSearch() {
        var article = articleInput.value.trim();
        if (!article) {
            articleInput.focus();
            return;
        }
        loading('Searching article...');
        api('brands', { article: article }).then(function (items) {
            renderBrandSearch(items, article);
        }).catch(showError);
    }

    function sectionFromHash() {
        var value = (location.hash || '#/passenger').replace('#/', '');
        return sectionLabels[value] ? value : 'passenger';
    }

    Array.prototype.forEach.call(document.querySelectorAll('.epc-umapi-tab'), function (tab) {
        tab.onclick = function () {
            state.section = tab.getAttribute('data-section');
            setHash(state.section);
            loadManufacturers();
        };
    });
    filterInput.oninput = applyFilter;
    if (vinButton) { vinButton.onclick = vinSearch; }
    if (vinInput) {
        vinInput.onkeydown = function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                vinSearch();
            }
        };
    }
    articleButton.onclick = articleSearch;
    articleInput.onkeydown = function (event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            articleSearch();
        }
    };
    window.addEventListener('hashchange', function () {
        var section = sectionFromHash();
        if (section !== state.section) {
            state.section = section;
            loadManufacturers();
        }
    });

    // Deep link from the product page's Suitable-vehicles list:
    // /en/catalog?make=TOYOTA&model=Avensis — auto-drill to that car.
    function initVehicleFromQuery() {
        var params = new URLSearchParams(location.search);
        var make = (params.get('make') || '').trim();
        if (!make) { return false; }
        var model = (params.get('model') || '').trim().toLowerCase();
        loading('Loading ' + make + '...');
        api('manufacturers', {}).then(function (items) {
            items = apiItems(items) || [];
            // Try progressively longer makes ("ALFA" → "ALFA ROMEO" → …) so
            // multi-word brands from fitment rows resolve to the right maker.
            var m = null;
            var modelWords = model ? model.split(' ') : [];
            for (var extra = 0; !m && extra <= modelWords.length; extra++) {
                var cand = make + (extra > 0 ? ' ' + modelWords.slice(0, extra).join(' ') : '');
                var cl = cand.toLowerCase();
                m = items.filter(function (it) {
                    return String(it.MANUFACTURER || '').toLowerCase() === cl;
                })[0] || items.filter(function (it) {
                    return String(it.MANUFACTURER || '').toLowerCase().indexOf(cl) === 0;
                })[0];
                if (m && extra > 0) { model = modelWords.slice(extra).join(' '); }
            }
            if (!m) { renderManufacturers(items); return; }
            state.manufacturer = m;
            state.vehicleType = chooseVehicleType(m);
            loading('Loading models...');
            api('models', { MFA_ID: m.MFA_ID }).then(function (mods) {
                mods = apiItems(mods) || [];
                if (!model) { renderModels(mods); return; }
                var hit = mods.filter(function (it) {
                    return String(it.MODEL_SERIES || '').toLowerCase().indexOf(model) === 0;
                })[0] || mods.filter(function (it) {
                    return String(it.MODEL_SERIES || '').toLowerCase().indexOf(model) !== -1;
                })[0];
                if (!hit) { renderModels(mods); return; }
                loadModifications(hit);
            }).catch(showError);
        }).catch(showError);
        return true;
    }

    state.section = sectionFromHash();
    syncTabs();
    if (!initVehicleFromQuery() && !initVinFromQuery()) {
        loadManufacturers();
    }
})();
</script>
