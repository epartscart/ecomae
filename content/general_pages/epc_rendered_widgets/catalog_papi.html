<style>
.epc-papi{margin:0 0 30px}.epc-papi-panel{background:#fff;border:1px solid #e1e7ef;border-radius:8px;padding:16px}.epc-papi-title{margin:0 0 14px;font-size:24px;font-weight:700;color:#172536}.epc-papi-tabs,.epc-papi-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.epc-papi-tab,.epc-papi-step{border:1px solid #d7dee9;background:#fff;border-radius:6px;padding:9px 13px;cursor:pointer;font-weight:600}.epc-papi-tab.active,.epc-papi-step.active{background:#2b78d6;border-color:#2b78d6;color:#fff}.epc-papi-step{background:#f1f4f8;color:#6d7786;border:0;border-radius:20px;font-size:13px}.epc-papi-step.clickable{color:#1e67b1}.epc-papi-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.epc-papi-toolbar input{min-width:260px}.epc-papi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.epc-papi-card,.epc-papi-row{background:#fff;border:1px solid #e1e7ef;border-radius:8px;padding:12px;cursor:pointer}.epc-papi-card:hover,.epc-papi-row:hover{border-color:#2b78d6;box-shadow:0 4px 14px rgba(36,80,130,.12)}.epc-papi-card strong{display:block;color:#172536}.epc-papi-card small{color:#758195}.epc-papi-tree{list-style:none;padding:0}.epc-papi-tree li{margin:6px 0}.epc-papi-tree button{border:0;background:transparent;color:#1e67b1;padding:4px 0;text-align:left;font-weight:600}.epc-papi-article{display:flex;gap:14px;border:1px solid #e7edf5;border-radius:6px;padding:12px;margin-top:7px}.epc-papi-article strong{color:#1e67b1}.epc-papi-loader{padding:18px;text-align:center;color:#657184}.epc-papi-message{padding:14px;background:#fff8e1;border:1px solid #f0d98a;border-radius:8px}@media(max-width:767px){.epc-papi-toolbar input{min-width:100%}}
</style>
<div class="epc-papi" id="epc-papi"><h1 class="epc-papi-title">PAPI Catalog</h1><div class="epc-papi-tabs"><button class="epc-papi-tab active" data-type="PC">Passenger</button><button class="epc-papi-tab" data-type="CV">Commercial</button><button class="epc-papi-tab" data-type="Moto">Motorbike</button></div><div class="epc-papi-toolbar"><input id="epc-papi-filter" class="form-control" type="search" placeholder="Filter current list"><span style="color:#657184;padding-top:8px">TecDoc via PartsAPI</span></div><div class="epc-papi-steps" id="epc-papi-steps"></div><div class="epc-papi-panel" id="epc-papi-output"></div></div>
<script>(function(){'use strict';var root=document.getElementById('epc-papi');if(!root)return;var out=document.getElementById('epc-papi-output'),steps=document.getElementById('epc-papi-steps'),filter=document.getElementById('epc-papi-filter'),state={type:'PC',make:null,model:null,car:null,tree:null,items:[]};function t(v){return String(v==null?'':v)}function e(v){return t(v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}function rows(d){return Array.isArray(d)?d:(d&&Array.isArray(d.data)?d.data:[])}function api(method,p){var q=new URLSearchParams();q.set('method',method);Object.keys(p||{}).forEach(function(k){if(p[k]!==undefined&&p[k]!==null&&p[k]!=='')q.set(k,p[k])});return fetch('/api/partsapi_proxy.php?'+q.toString(),{credentials:'same-origin'}).then(function(r){return r.json().then(function(d){if(!r.ok||d.success===false)throw d;return d})})}function load(msg){out.innerHTML='<div class="epc-papi-loader">'+e(msg||'Loading catalog...')+'</div>'}function err(x){out.innerHTML='<div class="epc-papi-message">'+e(x&&x.error||'PAPI catalog is temporarily unavailable. A paid PartsAPI method subscription may be required.')+'</div>'}function title(){return state.car?(state.car.CAR_NAME||state.car.FULL_MODEL_NAME||'Modification'):state.model?(state.model.modelName||'Model'):state.make?(state.make.makeName||'Make'):'Passenger'}function drawSteps(active){var a=[['makes','Makes'],['models',state.make?state.make.makeName:'Models'],['cars',state.model?state.model.modelName:'Modifications'],['tree',state.car?title():'Parts groups']];steps.innerHTML=a.map(function(x){var ok=x[0]==='makes'||(x[0]==='models'&&state.make)||(x[0]==='cars'&&state.model)||(x[0]==='tree'&&state.car);return '<button class="epc-papi-step '+(x[0]===active?'active ':'')+(ok?'clickable':'')+'" data-step="'+x[0]+'">'+e(x[1])+'</button>'}).join('');Array.prototype.forEach.call(steps.querySelectorAll('.clickable'),function(b){b.onclick=function(){if(b.dataset.step==='makes')showMakes();else if(b.dataset.step==='models')showModels(state.make);else if(b.dataset.step==='cars')showCars(state.model);else showTree(state.car)}})}function cards(items,kind){state.items=items;var q=t(filter.value).toLowerCase();var list=items.filter(function(x){return !q||JSON.stringify(x).toLowerCase().indexOf(q)>=0});if(!list.length){out.innerHTML='<div class="epc-papi-message">No matching records.</div>';return}out.innerHTML='<div style="margin-bottom:10px;color:#657184">'+list.length+' results</div><div class="epc-papi-grid">'+list.map(function(x,i){var id=kind==='make'?x.makeId:kind==='model'?x.modelId:kind==='car'?x.CAR_ID:x.STR_ID;var name=kind==='make'?x.makeName:kind==='model'?x.modelName:kind==='car'?(x.FULL_MODEL_NAME||x.CAR_NAME):((x.STR_NODE_NAME||x.NODE_1_TEXT||x.ROOT_NODE_TEXT)||'Parts group');return '<button class="epc-papi-card" data-i="'+items.indexOf(x)+'"><strong>'+e(name)+'</strong><small>'+e(kind==='car'?(x.YEAR_START||'')+' '+(x.ENGINE_TYPE||''):id)+'</small></button>'}).join('')+'</div>';Array.prototype.forEach.call(out.querySelectorAll('[data-i]'),function(b){b.onclick=function(){var x=items[+b.dataset.i];if(kind==='make')showModels(x);else if(kind==='model')showCars(x);else if(kind==='car')showTree(x);else showArticles(x)}})}function showMakes(){state.make=state.model=state.car=state.tree=null;drawSteps('makes');load('Loading PartsAPI manufacturers...');api('getMakes',{carType:state.type,lang:'16'}).then(function(d){cards(rows(d),'make')}).catch(err)}function showModels(m){state.make=m;state.model=state.car=state.tree=null;drawSteps('models');load('Loading models...');api('getModels',{carType:state.type,makeId:m.makeId,lang:'16'}).then(function(d){cards(rows(d),'model')}).catch(err)}function showCars(m){state.model=m;state.car=state.tree=null;drawSteps('cars');load('Loading modifications...');api('getCars',{carType:state.type,makeId:state.make.makeId,modelId:m.modelId,lang:'16'}).then(function(d){cards(rows(d),'car')}).catch(err)}function showTree(c){state.car=c;state.tree=null;drawSteps('tree');load('Loading parts groups...');api('getSearchTree',{carId:c.CAR_ID,carType:state.type,lang:'16'}).then(function(d){var a=rows(d);state.items=a;drawTree(a)}).catch(err)}function drawTree(a){var q=t(filter.value).toLowerCase();var x=a.filter(function(v){return !q||JSON.stringify(v).toLowerCase().indexOf(q)>=0});out.innerHTML='<div style="margin-bottom:10px;color:#657184">Select a parts group for '+e(title())+'</div><ul class="epc-papi-tree">'+x.map(function(v,i){var n=v.STR_NODE_NAME||v.NODE_3_TEXT||v.NODE_2_TEXT||v.NODE_1_TEXT||v.ROOT_NODE_TEXT||'Parts group';return '<li><button data-i="'+i+'">'+e(n)+'</button></li>'}).join('')+'</ul>';Array.prototype.forEach.call(out.querySelectorAll('[data-i]'),function(b){b.onclick=function(){showArticles(a[+b.dataset.i])}})}function showArticles(n){state.tree=n;drawSteps('tree');load('Loading articles...');api('getArticles',{lang:'16',strId:n.STR_ID||n.NODE_3_STR_ID||n.NODE_2_STR_ID||n.NODE_1_STR_ID||n.ROOT_NODE_STR_ID,carId:state.car.CAR_ID,carType:state.type}).then(function(d){var a=rows(d);out.innerHTML=a.length?a.map(function(x){var brand=x.ART_SUP_BRAND||x.SUP_BRAND||'';var no=x.ART_ARTICLE_NR||'';return '<div class="epc-papi-article"><div><strong>'+e(brand)+' '+e(no)+'</strong><div>'+e(x.PRODUCT_GROUP||x.ART_DES||'')+'</div></div><a class="btn btn-sm btn-primary" href="/en/parts/'+encodeURIComponent(brand)+'/'+encodeURIComponent(no)+'">View part</a></div>'}).join(''):'<div class="epc-papi-message">No articles found for this group.</div>'}).catch(err)};filter.oninput=function(){if(state.items.length){if(state.car&&!state.tree)cards(state.items,'car');else if(state.tree)drawTree(state.items);else cards(state.items,state.model?'model':state.make?'model':'make')}};Array.prototype.forEach.call(root.querySelectorAll('[data-type]'),function(b){b.onclick=function(){state.type=b.dataset.type;Array.prototype.forEach.call(root.querySelectorAll('[data-type]'),function(x){x.classList.toggle('active',x===b)});showMakes()}});showMakes()})()</script>
